<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="card">
        <!-- Header status -->
        <header>
            <div class="logo-area">
                <span class="pulse-indicator"></span>
                <h1>Promptify</h1>
            </div>
            <span id="tracker-status-text" class="status-badge">Idle</span>
        </header>

        <main>
            <!-- Prominent Main Duration -->
            <div class="hero-stats">
                <p class="time-label">TODAY'S USAGE</p>
                <h1 id="total-time-today">0m</h1>
            </div>

            <!-- Platform List Breakdown -->
            <div class="platforms-list" id="platforms-container">
                <!-- Dynamically populated by popup.js -->
            </div>

            <!-- Footer Summary Cards -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <span id="sessions-count-val" class="metric-val">—</span>
                    <span class="metric-label">Sessions</span>
                </div>
                <div class="metric-card">
                    <span id="avg-duration-val" class="metric-val">—</span>
                    <span class="metric-label">Avg. Session</span>
                </div>
            </div>
        </main>

        <footer>
            <button id="open-dashboard-btn" class="dashboard-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Open Dashboard
            </button>
            <p class="footer-version">Active Time Tracking Engine v2.0.0</p>
        </footer>
    </div>
    <script src="../../src/platforms.js"></script>
    <script src="../../src/db.js"></script>
    <script src="../../src/analytics.js"></script>
    <script src="popup.js"></script>
</body>
</html>
